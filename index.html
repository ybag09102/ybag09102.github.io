<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system, BlinkMacSystemFont;
}

/* 상단 탭 */
.tabs {
  display:flex;
  background:white;
  padding:12px 16px;
  font-weight:600;
  border-bottom:1px solid #e5e5e5;
}
.tabs div {
  margin-right:20px;
  opacity:0.4;
}
.tabs .active {
  opacity:1;
  border-bottom:2px solid black;
  padding-bottom:4px;
}

/* 카드 (9:16 비율🔥) */
.card {
  width:92%;
  max-width:420px;
  aspect-ratio: 9/16;
  margin:15px auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  position:relative;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
}

/* 사진 중앙 */
.profile {
  width:120px;
  height:150px;
  border-radius:10px;
  object-fit:cover;
  margin:0 auto;
}

/* 이름 */
.name {
  text-align:center;
  font-size:22px;
  font-weight:700;
  margin-top:10px;
}

/* 정보 */
.info {
  text-align:center;
  font-size:14px;
  margin-top:6px;
  line-height:1.6;
}

/* 연한 글씨 */
.light {
  text-align:center;
  font-size:12px;
  color:#aaa;
  margin-top:6px;
}

/* 스위치 */
.switch {
  position:absolute;
  right:18px;
  top:18px;
}
.switch input { display:none; }

.slider {
  width:44px;
  height:22px;
  background:#d9d9d9;
  border-radius:30px;
  position:relative;
}
.slider::before {
  content:"";
  width:18px;
  height:18px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:3px;
  transition:0.25s;
}
input:checked + .slider {
  background:black;
}
input:checked + .slider::before {
  transform:translateX(20px);
}

/* 바 */
.bar-wrap {
  margin-top:auto;
  height:5px;
  background:#e2e2e2;
  border-radius:4px;
  overflow:hidden;
}
.bar {
  height:5px;
  background:linear-gradient(to right, #4a6cff, #8e3cff);
  width:100%;
}

/* 시간 */
.time {
  font-size:12px;
  margin-top:5px;
  color:#777;
  text-align:center;
}

/* 버튼 */
.btn {
  margin-top:10px;
  background:black;
  color:white;
  padding:10px;
  text-align:center;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
}

/* QR */
.qr {
  display:none;
  text-align:center;
  margin-top:10px;
}
.qr img {
  width:130px;
}
</style>
</head>

<body>

<div class="tabs">
  <div class="active">주민등록증</div>
  <div>운전면허증</div>
</div>

<div class="card">

  <!-- 스위치 -->
  <div class="switch">
    <label>
      <input type="checkbox" id="toggle" onchange="toggleAddr()">
      <div class="slider"></div>
    </label>
  </div>

  <!-- 사진 -->
  <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">

  <!-- 이름 -->
  <div class="name">박유건</div>

  <!-- 정보 -->
  <div class="info">
    060923 - 3173611<br>
    <span id="addr">경기도 양주시</span><br>
    2024.12.31
  </div>

  <div class="light">경기도 양주시장</div>

  <!-- 하단 -->
  <div class="bar-wrap">
    <div class="bar" id="bar"></div>
  </div>

  <div class="time" id="time">남은시간 30초</div>

  <div class="btn" onclick="showQR()">QR정보 표시</div>

  <div class="qr" id="qrBox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=random">
  </div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;

  document.getElementById("time").innerText = "남은시간 " + time + "초";
  document.getElementById("bar").style.width = (time/30*100) + "%";
},1000);

function toggleAddr(){
  let toggle = document.getElementById("toggle");
  let addr = document.getElementById("addr");

  if(toggle.checked){
    addr.innerText = "경기도 양주시 옥정서로 72 옥정동 옥정중앙역 중흥S-클래스 센텀시티 1블록 111동 2003호";
  } else {
    addr.innerText = "경기도 양주시";
  }
}

function showQR(){
  let qr = document.getElementById("qrBox");
  let toggle = document.querySelector(".switch");

  if(qr.style.display === "block"){
    qr.style.display = "none";
    toggle.style.display = "block";
  } else {
    qr.style.display = "block";
    toggle.style.display = "none";
  }
}
</script>

</body>
</html>
