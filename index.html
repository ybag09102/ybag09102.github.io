<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system, BlinkMacSystemFont;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* 상단 제목 */
.header {
  width:100%;
  max-width:420px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  padding:14px 0;
  background:white;
  border-bottom:1px solid #eee;
}

/* 탭 */
.tabs {
  width:100%;
  max-width:420px;
  display:flex;
  justify-content:center;
  gap:30px;
  background:white;
  padding:12px 16px;
  font-weight:600;
  border-bottom:1px solid #e5e5e5;
}
.tabs div { opacity:0.4; }
.tabs .active {
  opacity:1;
  border-bottom:2px solid black;
}

/* 카드 */
.card {
  width:92%;
  max-width:420px;
  margin:40px auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

/* 기본 레이아웃 */
.normal-layout {
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* QR 레이아웃 */
.qr-layout {
  display:none;
  width:100%;
  align-items:center;
  justify-content:space-between;
}

/* 왼쪽 정보 */
.left-info {
  font-size:18px;
  line-height:1.6;
}

/* QR */
.qr-right img {
  width:140px;
}

/* 사진 */
.profile {
  width:180px;
  height:220px;
  border-radius:10px;
  object-fit:cover;
}

/* 이름 */
.name {
  font-size:32px;
  font-weight:700;
  margin-top:10px;
  align-self:flex-start;
}

/* 정보 */
.info {
  font-size:20px;
  margin-top:6px;
  line-height:1.6;
  align-self:flex-start;
}

.birth {
  font-size:24px;
}

.light {
  font-size:16px;
  color:#aaa;
  margin-top:6px;
  align-self:flex-start;
}

/* 시간 */
.time {
  font-size:14px;
  margin-top:10px;
  color:#777;
  align-self:flex-start;
}
.sec {
  color:#5b8cff;
}

/* ===== 초 막대 ===== */
.bar {
  width:100%;
  height:6px;
  background:#e5e5e5;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}

.bar-inner {
  height:100%;
  width:100%;
  background: linear-gradient(
    90deg,
    #4facfe 0%,
    #5b8cff 30%,
    #6a3cff 60%,
    #8e2cff 100%
  );
  transition: width 1s linear;
}
/* =================== */

/* 버튼 */
.btn {
  margin-top:14px;
  background:black;
  color:white;
  padding:12px;
  width:100%;
  text-align:center;
  border-radius:10px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="header">모바일 신분증</div>

<div class="tabs">
  <div class="active">주민등록증</div>
  <div>운전면허증</div>
</div>

<div class="card">

  <!-- 기본 화면 -->
  <div id="normal" class="normal-layout">
    <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">

    <div class="name">박유건</div>

    <div class="info">
      <div>060923 - 3173611</div>
      <div>경기도 양주시 옥정동</div>
      <div class="birth">2024.12.31</div>
    </div>

    <div class="light">경기도 양주시장</div>

    <div class="time">
      남은시간 <span class="sec" id="sec">30초</span>
    </div>

    <div class="bar">
      <div class="bar-inner" id="bar"></div>
    </div>
  </div>

  <!-- QR 화면 -->
  <div id="qrLayout" class="qr-layout">
    <div class="left-info">
      <div>경기도 양주시</div>
      <div class="birth">24.12.31</div>
    </div>

    <div class="qr-right">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=random">
    </div>
  </div>

  <div class="btn" onclick="toggleQR()">QR정보 표시</div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;

  document.getElementById("sec").innerText = time + "초";

  let percent = (time / 30) * 100;
  document.getElementById("bar").style.width = percent + "%";

},1000);

function toggleQR(){
  const normal = document.getElementById("normal");
  const qr = document.getElementById("qrLayout");

  if(qr.style.display === "flex"){
    qr.style.display = "none";
    normal.style.display = "flex";
  } else {
    qr.style.display = "flex";
    normal.style.display = "none";
  }
}
</script>

</body>
</html>
