<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#e9ecef;
  font-family:sans-serif;
}

/* 상단 */
.tabs {
  display:flex;
  background:white;
  padding:15px;
  font-weight:bold;
}
.tabs div {
  margin-right:20px;
  opacity:0.5;
}
.tabs .active {
  border-bottom:3px solid black;
  opacity:1;
}

/* 카드 */
.card {
  width:95%;
  max-width:420px;
  margin:20px auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
  position:relative;
}

/* 프로필 */
.profile {
  width:130px;
  height:160px;
  object-fit:cover;
  border-radius:10px;
  display:block;
  margin:auto;
}

.name {
  text-align:center;
  font-size:22px;
  margin-top:10px;
  font-weight:bold;
}

.info {
  margin-top:10px;
  font-size:14px;
}

/* 스위치 */
.switch {
  position:absolute;
  right:20px;
  top:120px;
}
.switch input { display:none; }

.slider {
  width:50px;
  height:25px;
  background:#ccc;
  border-radius:30px;
  position:relative;
  cursor:pointer;
}
.slider::before {
  content:"";
  width:20px;
  height:20px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:2.5px;
  left:3px;
  transition:0.3s;
}
input:checked + .slider {
  background:black;
}
input:checked + .slider::before {
  transform:translateX(24px);
}

/* 바 */
.bar-wrap {
  background:#ddd;
  height:6px;
  border-radius:5px;
  margin-top:15px;
  overflow:hidden;
}
.bar {
  height:6px;
  background:linear-gradient(to right, blue, purple);
  width:100%;
}

/* 시간 */
.time {
  font-size:13px;
  margin-top:5px;
  color:#555;
}

/* 버튼 */
.btn {
  margin-top:20px;
  background:black;
  color:white;
  padding:12px;
  text-align:center;
  border-radius:12px;
  font-weight:bold;
}

/* QR */
.qr {
  display:none;
  text-align:center;
  margin-top:15px;
}
.qr img {
  width:150px;
}

/* 애니메이션 */
.fade {
  animation:fade 0.5s;
}
@keyframes fade {
  from {opacity:0;}
  to {opacity:1;}
}
</style>
</head>

<body>

<div class="tabs">
  <div class="active">주민등록증</div>
  <div>운전면허증</div>
</div>

<div class="card fade">

  <img class="profile" id="profile" src="https://via.placeholder.com/130x160">

  <div class="name" id="name">홍길동</div>

  <div class="info">
    <span id="num">060923 - 3173611</span><br>
    <span id="addr"경기도 양주시 옥정서로 72 옥정중앙역 중흥S-클래스 센텀시티 1블록 111동 2003호</span><br>
    <span id="date">2024.12.31</span>
  </div>

  <!-- 스위치 -->
  <div class="switch">
    <label>
      <input type="checkbox">
      <div class="slider"></div>
    </label>
  </div>

  <!-- 바 -->
  <div class="bar-wrap">
    <div class="bar" id="bar"></div>
  </div>
  <div class="time" id="time">남은시간 30초</div>

  <!-- 버튼 -->
  <div class="btn" onclick="showQR()">QR정보 표시</div>

  <!-- QR -->
  <div class="qr" id="qrBox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=hello">
  </div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;

  document.getElementById("time").innerText = "남은시간 " + time + "초";
  document.getElementById("bar").style.width = (time/30*100) + "%";
},1000);

function showQR(){
  let qr = document.getElementById("qrBox");
  qr.style.display = qr.style.display === "block" ? "none" : "block";
}
</script>

</body>
</html>
