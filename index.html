<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system, BlinkMacSystemFont;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.tabs {
  width:100%;
  max-width:420px;
  display:flex;
  background:white;
  padding:12px 16px;
  font-weight:600;
  border-bottom:1px solid #e5e5e5;
}
.tabs div {
  margin-right:20px;
  opacity:0.4;
}
.tabs .active {
  opacity:1;
  border-bottom:2px solid black;
  padding-bottom:4px;
}

.card {
  width:92%;
  max-width:420px;
  aspect-ratio: 9/16;
  margin:40px auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  position:relative;
  display:flex;
  flex-direction:column;
  transform: scale(0.8);
  transform-origin: top center;
}

.profile {
  width:180px;
  height:220px;
  border-radius:10px;
  object-fit:cover;
  margin:0 auto;
}

.name {
  font-size:33px;
  font-weight:700;
  margin-top:10px;
  text-align:left;
}

.info {
  font-size:21px;
  margin-top:6px;
  line-height:1.6;
  text-align:left;
}

.birth {
  font-size:26px;
}

.light {
  font-size:18px;
  color:#aaa;
  margin-top:6px;
  text-align:left;
}

.switch {
  position:absolute;
  right:20px;
  top:270px;
}
.switch input { display:none; }

.slider {
  width:50px;
  height:26px;
  background:#d9d9d9;
  border-radius:30px;
  position:relative;
}
.slider::before {
  content:"";
  width:22px;
  height:22px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:3px;
  transition:0.25s;
}
input:checked + .slider {
  background:black;
}
input:checked + .slider::before {
  transform:translateX(24px);
}

.time {
  font-size:16px;
  margin-top:5px;
  color:#777;
  text-align:left;
}
.sec {
  color:#4FC3F7;
}

.bar {
  width:100%;
  height:6px;
  background:#e5e5e5;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}
.bar-inner {
  height:100%;
  width:100%;
  background:#4FC3F7;
  transition:width 1s linear;
}

.btn {
  margin-top:12px;
  background:black;
  color:white;
  padding:12px;
  text-align:center;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
}

/* QR와 왼쪽 정보 분리 */
.qr-layout {
  display:flex;
  justify-content:space-between;
  margin-top:20px;
}

.qr {
  text-align:center;
}
.qr img {
  width:200px;
}

.left-info {
  text-align:left;
  font-size:21px;
}

.hidden {
  display:none !important;
}
</style>
</head>

<body>

<div class="tabs">
  <div class="active">주민등록증</div>
  <div>운전면허증</div>
</div>

<div class="card">

  <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">

  <div class="name">박유건</div>

  <div id="infoBlock" class="toggle-hide">
    <div class="info">
      <div>060923 - 3173611</div>
      <div id="addr">경기도 양주시 옥정동</div>
      <div class="birth">24</div>
    </div>
    <div class="light">경기도 양주시장</div>
  </div>

  <!-- QR + 왼쪽 정보 -->
  <div class="qr-layout hidden" id="qrBox">
    <div class="left-info">
      <div id="leftAddr">경기도 양주시 옥정동</div>
      <div id="leftBirth">24</div>
    </div>
    <div class="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=random">
    </div>
  </div>

  <div class="switch">
    <label>
      <input type="checkbox" id="toggle" onchange="toggleAddr()">
      <div class="slider"></div>
    </label>
  </div>

  <div id="timeBlock" class="toggle-hide">
    <div class="time">
      남은시간 <span class="sec" id="sec">30초</span>
    </div>
    <div class="bar">
      <div class="bar-inner" id="bar"></div>
    </div>
  </div>

  <div class="btn" onclick="showQR()">QR정보 표시</div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;

  document.getElementById("sec").innerText = time + "초";

  let percent = (time / 30) * 100;
  document.getElementById("bar").style.width = percent + "%";

},1000);

function toggleAddr(){
  let toggle = document.getElementById("toggle");
  let addr = document.getElementById("addr");
  let leftAddr = document.getElementById("leftAddr");

  if(toggle.checked){
    addr.innerText = "경기도 양주시 옥정서로 72 옥정동 옥정중앙역 중흥S-클래스 센텀시티 1블록 111동 2003호";
    leftAddr.innerText = addr.innerText;
  } else {
    addr.innerText = "경기도 양주시 옥정동";
    leftAddr.innerText = addr.innerText;
  }
}

function showQR(){
  let qr = document.getElementById("qrBox");
  let hide = document.querySelectorAll(".toggle-hide");

  if(qr.classList.contains("hidden")){
    qr.classList.remove("hidden");
    hide.forEach(e => e.classList.add("hidden"));
  } else {
    qr.classList.add("hidden");
    hide.forEach(e => e.classList.remove("hidden"));
  }
}
</script>

</body>
</html>
