<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
}

/* 상단 */
.header {
  padding:14px 16px;
  font-size:17px;
  font-weight:600;
  background:#fff;
  border-bottom:1px solid #e6e6e6;
}

/* 카드 */
.card {
  width:94%;
  max-width:430px;
  margin:14px auto;
  background:#fff;
  border-radius:16px;
  padding:18px;
  box-shadow:0 3px 10px rgba(0,0,0,0.06);
  position:relative;
}

/* 프로필 */
.profile {
  width:112px;
  height:142px;
  border-radius:6px;
  object-fit:cover;
}

/* 이름 */
.name {
  font-size:21px;
  font-weight:700;
  margin-top:8px;
}

/* 정보 */
.info {
  font-size:14px;
  color:#222;
  line-height:1.5;
  margin-top:3px;
}

/* 연한 텍스트 */
.light {
  font-size:12px;
  color:#b0b0b0;
  margin-top:6px;
}

/* 스위치 */
.switch {
  position:absolute;
  right:16px;
  top:16px;
}
.switch input { display:none; }

.slider {
  width:44px;
  height:22px;
  background:#d9d9d9;
  border-radius:30px;
  position:relative;
}
.slider::before {
  content:"";
  width:18px;
  height:18px;
  background:#fff;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:3px;
  transition:0.25s;
}
input:checked + .slider {
  background:#000;
}
input:checked + .slider::before {
  transform:translateX(20px);
}

/* 바 */
.bar-wrap {
  margin-top:14px;
  height:5px;
  background:#e2e2e2;
  border-radius:4px;
  overflow:hidden;
}
.bar {
  height:5px;
  background:linear-gradient(to right, #4a6cff, #8e3cff);
  width:100%;
}

/* 시간 */
.time {
  font-size:12px;
  margin-top:5px;
  color:#777;
}

/* 버튼 */
.btn {
  margin-top:16px;
  background:#000;
  color:#fff;
  padding:11px;
  text-align:center;
  border-radius:10px;
  font-size:14px;
  font-weight:600;
}

/* QR */
.qr {
  display:none;
  text-align:center;
  margin-top:14px;
}
.qr img {
  width:140px;
}
</style>
</head>

<body>

<div class="header">주민등록증</div>

<div class="card">

  <div class="switch">
    <label>
      <input type="checkbox" id="toggle" onchange="toggleAddr()">
      <div class="slider"></div>
    </label>
  </div>

  <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">

  <div class="name">박유건</div>

  <div class="info">
    060923 - 3173611<br>
    <span id="addr">경기도 양주시</span><br>
    2024.12.31
  </div>

  <div class="light">경기도 양주시장</div>

  <div class="bar-wrap">
    <div class="bar" id="bar"></div>
  </div>
  <div class="time" id="time">남은시간 30초</div>

  <div class="btn" onclick="showQR()">QR정보 표시</div>

  <div class="qr" id="qrBox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=random">
  </div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;

  document.getElementById("time").innerText = "남은시간 " + time + "초";
  document.getElementById("bar").style.width = (time/30*100) + "%";
},1000);

function toggleAddr(){
  let toggle = document.getElementById("toggle");
  let addr = document.getElementById("addr");

  if(toggle.checked){
    addr.innerText = "경기도 양주시 옥정서로 72 옥정동 옥정중앙역 중흥S-클래스 센텀시티 1블록 111동 2003호";
  } else {
    addr.innerText = "경기도 양주시";
  }
}

function showQR(){
  let qr = document.getElementById("qrBox");
  let toggle = document.querySelector(".switch");

  if(qr.style.display === "block"){
    qr.style.display = "none";
    toggle.style.display = "block";
  } else {
    qr.style.display = "block";
    toggle.style.display = "none";
  }
}
</script>

</body>
</html>
