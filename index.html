<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system, BlinkMacSystemFont;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* 상단 */
.header {
  width:100%;
  max-width:420px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  padding:14px 0;
  background:white;
  border-bottom:1px solid #eee;
}

.tabs {
  width:100%;
  max-width:420px;
  display:flex;
  justify-content:center;
  gap:30px;
  background:white;
  padding:12px;
  border-bottom:1px solid #e5e5e5;
}
.tabs div { opacity:0.4; }
.tabs .active { opacity:1; border-bottom:2px solid black; }

/* 카드 */
.card {
  width:92%;
  max-width:420px;
  margin:40px auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

/* 기본 레이아웃 */
.normal {
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* QR 모드 */
.qr-mode {
  display:none;
  width:100%;
  align-items:center;
  justify-content:space-between;
}

/* 사진 + 이름 왼쪽 */
.left-section {
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

/* 왼쪽 정보 */
.left-info {
  font-size:20px;
  line-height:1.8;
  margin-top:10px;
}

/* QR */
.qr img {
  width:150px;
}

/* 사진 */
.profile {
  width:180px;
  height:220px;
  border-radius:10px;
  object-fit:cover;
}

.name {
  font-size:32px;
  font-weight:700;
  margin-top:10px;
}

/* 카드 내부 정보 */
.info {
  font-size:20px;
  margin-top:6px;
  line-height:1.6;
}

.birth { font-size:24px; }

.light {
  font-size:16px;
  color:#aaa;
  margin-top:6px;
}

/* 시간 */
.time {
  font-size:14px;
  margin-top:10px;
  color:#777;
}
.sec { color:#5b8cff; }

/* 막대 */
.bar {
  width:100%;
  height:6px;
  background:#e5e5e5;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}

.bar-inner {
  height:100%;
  width:100%;
  background: linear-gradient(
    90deg,
    #4facfe 0%,
    #5b8cff 30%,
    #6a3cff 60%,
    #8e2cff 100%
  );
  transition: width 1s linear;
}

/* 버튼 */
.btn {
  margin-top:14px;
  background:black;
  color:white;
  padding:12px;
  width:100%;
  text-align:center;
  border-radius:10px;
  font-weight:600;
}
</style>
</head>

<body>

<div class="header">모바일 신분증</div>

<div class="tabs">
  <div class="active">주민등록증</div>
  <div>운전면허증</div>
</div>

<div class="card">

  <!-- 기본 화면 -->
  <div id="normal" class="normal">
    <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">
    <div class="name">박유건</div>
    <div class="info">
      <div>060923 - 3173611</div>
      <div>경기도 양주시 옥정동</div>
      <div class="birth">24.12.31</div>
    </div>
    <div class="light">경기도 양주시장</div>
    <div class="time">남은시간 <span id="sec" class="sec">30초</span></div>
    <div class="bar">
      <div id="bar" class="bar-inner"></div>
    </div>
  </div>

  <!-- QR 화면 -->
  <div id="qrMode" class="qr-mode">
    <div class="left-section">
      <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">
      <div class="name">박유건</div>
      <div class="left-info">
        <div>경기도 양주시 옥정동</div>
        <div class="birth">24.12.31</div>
      </div>
    </div>
    <div class="qr">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=random">
    </div>
  </div>

  <div class="btn" onclick="toggleQR()">QR정보 표시</div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;
  document.getElementById("sec").innerText = time + "초";
  document.getElementById("bar").style.width = (time/30*100) + "%";
},1000);

function toggleQR(){
  const normal = document.getElementById("normal");
  const qr = document.getElementById("qrMode");
  if(qr.style.display === "flex"){
    qr.style.display = "none";
    normal.style.display = "flex";
  } else {
    qr.style.display = "flex";
    normal.style.display = "none";
  }
}
</script>

</body>
</html>
