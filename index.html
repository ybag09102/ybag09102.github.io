<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f2f3f5;
  font-family:-apple-system, BlinkMacSystemFont;
}

/* 상태바 (아이폰 느낌) */
.statusbar {
  height:25px;
  background:white;
  display:flex;
  justify-content:space-between;
  padding:0 10px;
  font-size:12px;
  align-items:center;
}

/* 상단 */
.header {
  padding:15px;
  font-size:18px;
  font-weight:bold;
  background:white;
  border-bottom:1px solid #ddd;
}

/* 카드 */
.card {
  width:92%;
  max-width:420px;
  margin:20px auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 8px 20px rgba(0,0,0,0.1);
  position:relative;
}

/* 프로필 */
.profile {
  width:110px;
  height:140px;
  border-radius:8px;
  object-fit:cover;
}

/* 이름 */
.name {
  font-size:22px;
  font-weight:bold;
  margin-top:10px;
}

/* 정보 */
.info {
  font-size:14px;
  margin-top:5px;
}

/* 연한 글씨 */
.light {
  font-size:12px;
  color:#999;
  margin-top:3px;
}

/* 스위치 */
.switch {
  position:absolute;
  right:20px;
  top:20px;
}
.switch input { display:none; }

.slider {
  width:45px;
  height:24px;
  background:#ccc;
  border-radius:30px;
  position:relative;
}
.slider::before {
  content:"";
  width:18px;
  height:18px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:3px;
  left:3px;
  transition:0.3s;
}
input:checked + .slider {
  background:black;
}
input:checked + .slider::before {
  transform:translateX(21px);
}

/* 바 */
.bar-wrap {
  margin-top:15px;
  height:5px;
  background:#ddd;
  border-radius:5px;
  overflow:hidden;
}
.bar {
  height:5px;
  background:linear-gradient(to right, blue, purple);
  width:100%;
}

/* 시간 */
.time {
  font-size:12px;
  margin-top:5px;
  color:#666;
}

/* 버튼 */
.btn {
  margin-top:15px;
  background:black;
  color:white;
  padding:10px;
  text-align:center;
  border-radius:10px;
}

/* QR */
.qr {
  display:none;
  text-align:center;
  margin-top:15px;
}
.qr img {
  width:140px;
}
</style>
</head>

<body>

<!-- 상태바 -->
<div class="statusbar">
  <div>23:41</div>
  <div>📶 🔋</div>
</div>

<!-- 상단 -->
<div class="header">주민등록증</div>

<div class="card">

  <!-- 스위치 -->
  <div class="switch">
    <label>
      <input type="checkbox" id="toggle" onchange="toggleAddr()">
      <div class="slider"></div>
    </label>
  </div>

  <!-- 🔥 여기 사진 바꾸면 됨 -->
  <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">

  <div class="name">박유건</div>

  <div class="info">
    060923 - 3173611<br>
    <span id="addr">경기도 양주시</span><br>
    2024.12.31
  </div>

  <div class="light">경기도 양주시장</div>

  <div class="bar-wrap">
    <div class="bar" id="bar"></div>
  </div>
  <div class="time" id="time">남은시간 30초</div>

  <div class="btn" onclick="showQR()">QR정보 표시</div>

  <div class="qr" id="qrBox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=random">
  </div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;

  document.getElementById("time").innerText = "남은시간 " + time + "초";
  document.getElementById("bar").style.width = (time/30*100) + "%";
},1000);

function toggleAddr(){
  let toggle = document.getElementById("toggle");
  let addr = document.getElementById("addr");

  if(toggle.checked){
    addr.innerText = "경기도 양주시 옥정서로 72 옥정동 옥정중앙역 중흥S-클래스 센텀시티 1블록 111동 2003호";
  } else {
    addr.innerText = "경기도 양주시";
  }
}

function showQR(){
  let qr = document.getElementById("qrBox");
  let toggle = document.querySelector(".switch");

  if(qr.style.display === "block"){
    qr.style.display = "none";
    toggle.style.display = "block";
  } else {
    qr.style.display = "block";
    toggle.style.display = "none";
  }
}
</script>

</body>
</html>
