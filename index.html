<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system, BlinkMacSystemFont;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* 상단 탭 */
.tabs {
  width:100%;
  max-width:420px;
  display:flex;
  background:white;
  padding:12px 16px;
  font-weight:600;
  border-bottom:1px solid #e5e5e5;
}
.tabs div {
  margin-right:20px;
  opacity:0.4;
}
.tabs .active {
  opacity:1;
  border-bottom:2px solid black;
  padding-bottom:4px;
}

/* 카드 */
.card {
  width:92%;
  max-width:420px;
  aspect-ratio: 9/16;
  margin:40px auto;
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  position:relative;
  display:flex;
  flex-direction:column;

  transform: scale(0.8);
  transform-origin: top center;
}

/* 사진 */
.profile {
  width:180px;
  height:220px;
  border-radius:10px;
  object-fit:cover;
  margin:0 auto;
}

/* 이름 */
.name {
  font-size:33px;
  font-weight:700;
  margin-top:10px;
  text-align:left;
}

/* 정보 */
.info {
  font-size:21px;
  margin-top:6px;
  line-height:1.6;
  text-align:left;
}

/* 생일 */
.birth {
  font-size:26px;
}

/* 연한 글씨 */
.light {
  font-size:18px;
  color:#aaa;
  margin-top:6px;
  text-align:left;
}

/* 스위치 */
.switch {
  position:absolute;
  right:20px;
  top:270px;
}
.switch input { display:none; }

.slider {
  width:50px;
  height:26px;
  background:#d9d9d9;
  border-radius:30px;
  position:relative;
}
.slider::before {
  content:"";
  width:22px;
  height:22px;
  background:white;
  border-radius:50%;
  position:absolute;
  top:2px;
  left:3px;
  transition:0.25s;
}
input:checked + .slider {
  background:black;
}
input:checked + .slider::before {
  transform:translateX(24px);
}

/* 바 */
.bar-wrap {
  margin-top:auto;
  height:6px;
  background:#e2e2e2;
  border-radius:4px;
  overflow:hidden;
}
.bar {
  height:6px;
  background:linear-gradient(to right, #4a6cff, #8e3cff);
  width:100%;
}

/* 시간 (하늘색🔥) */
.time {
  font-size:16px;
  margin-top:5px;
  color:#4FC3F7;
  text-align:left;
}

/* 버튼 */
.btn {
  margin-top:12px;
  background:black;
  color:white;
  padding:12px;
  text-align:center;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
}

/* QR */
.qr {
  display:none;
  text-align:center;
  margin-top:10px;
}
.qr img {
  width:200px;
}

/* 숨김 */
.hidden {
  display:none !important;
}
</style>
</head>

<body>

<div class="tabs">
  <div class="active">주민등록증</div>
  <div>운전면허증</div>
</div>

<div class="card">

  <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">

  <div class="name">박유건</div>

  <div class="info">
    060923 - 3173611<br>
    <span id="addr" class="toggle-hide">경기도 양주시</span><br>
    <span class="birth toggle-hide">2024.12.31</span>
  </div>

  <div class="light toggle-hide">경기도 양주시장</div>

  <div class="switch">
    <label>
      <input type="checkbox" id="toggle" onchange="toggleAddr()">
      <div class="slider"></div>
    </label>
  </div>

  <div class="bar-wrap toggle-hide">
    <div class="bar" id="bar"></div>
  </div>

  <div class="time toggle-hide" id="time">남은시간 30초</div>

  <div class="btn" onclick="showQR()">QR정보 표시</div>

  <div class="qr" id="qrBox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=random">
  </div>

</div>

<script>
let time = 30;

setInterval(()=>{
  time--;
  if(time < 0) time = 30;

  document.getElementById("time").innerText = "남은시간 " + time + "초";
  document.getElementById("bar").style.width = (time/30*100) + "%";
},1000);

function toggleAddr(){
  let toggle = document.getElementById("toggle");
  let addr = document.getElementById("addr");

  if(toggle.checked){
    addr.innerText = "경기도 양주시 옥정서로 72 옥정동 옥정중앙역 중흥S-클래스 센텀시티 1블록 111동 2003호";
  } else {
    addr.innerText = "경기도 양주시";
  }
}

function showQR(){
  let qr = document.getElementById("qrBox");
  let hideItems = document.querySelectorAll(".toggle-hide");

  if(qr.style.display === "block"){
    qr.style.display = "none";
    hideItems.forEach(e => e.classList.remove("hidden"));
  } else {
    qr.style.display = "block";
    hideItems.forEach(e => e.classList.add("hidden"));
  }
}
</script>

</body>
</html>
