<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모바일 신분증</title>

<style>
body {
  margin:0;
  background:#f4f5f7;
  font-family:-apple-system, BlinkMacSystemFont;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px 0; /* 상하 여백 확보 */
}

/* 상단 */
.header {
  width:100%;
  max-width:420px;
  text-align:center;
  font-size:18px;
  font-weight:700;
  padding:14px 0;
  background:white;
  border-bottom:1px solid #eee;
}

.tabs {
  width:100%;
  max-width:420px;
  display:flex;
  justify-content:center;
  gap:30px;
  background:white;
  padding:12px;
  border-bottom:1px solid #e5e5e5;
}
.tabs div { opacity:0.4; }
.tabs .active { opacity:1; border-bottom:2px solid black; }

/* 카드 */
.card {
  width:92%;
  max-width:420px;
  margin:20px auto; /* 카드 주변 여백 */
  background:white;
  border-radius:20px;
  padding:20px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  position:relative;
}

/* 사진 */
.profile {
  width:180px;
  height:220px;
  border-radius:10px;
  object-fit:cover;
  margin:0 auto;
}

/* 이름 */
.name {
  font-size:33px;
  font-weight:700;
  margin-top:10px;
  text-align:left;
}

/* 정보 */
.info {
  font-size:21px;
  margin-top:6px;
  line-height:1.6;
  text-align:left;
}

.birth {
  font-size:26px;
}

.light {
  font-size:18px;
  color:#aaa;
  margin-top:6px;
  text-align:left;
}

/* 시간 */
.time {
  font-size:16px;
  margin-top:5px;
  color:#777;
  text-align:left;
}
.sec {
  color:#4FC3F7;
}

/* 초 막대 */
.bar {
  width:100%;
  height:6px;
  background:#e5e5e5;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}
.bar-inner {
  height:100%;
  width:100%;
  background: linear-gradient(
    90deg,
    #4facfe 0%,
    #5b8cff 30%,
    #6a3cff 60%,
    #8e2cff 100%
  );
  transition:width 1s linear;
}

/* 버튼 */
.btn {
  margin-top:12px;
  background:black;
  color:white;
  padding:12px;
  text-align:center;
  border-radius:10px;
  font-size:16px;
  font-weight:600;
}

/* QR */
.qr-container {
  display:none;
  position:absolute;
  top:60px; 
  right:20px;
}
.qr-container img {
  width:120px;
}
</style>
</head>

<body>

<div class="header">모바일 신분증</div>

<div class="tabs">
  <div class="active">주민등록증</div>
  <div>운전면허증</div>
</div>

<div class="card" id="card">

  <img class="profile" src="https://i.imgur.com/A3pRcPr.jpeg">
  <div class="name">박유건</div>

  <div class="info" id="fullInfo">
    <div class="phone">060923 - 3173611</div>
    <div id="addr">경기도 양주시 옥정동</div>
    <div class="birth">24.12.31</div>
  </div>

  <div class="light" id="lightInfo">경기도 양주시장</div>

  <div class="time">
    남은시간 <span class="sec" id="sec">30초</span>
  </div>

  <div class="bar">
    <div class="bar-inner" id="bar"></div>
  </div>

  <div class="qr-container" id="qrBox">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=random">
  </div>

  <div class="btn" onclick="toggleQR()">QR정보 표시</div>

</div>

<script>
let time = 30;
setInterval(()=>{
  time--;
  if(time < 0) time = 30;
  document.getElementById("sec").innerText = time + "초";
  document.getElementById("bar").style.width = (time/30*100) + "%";
},1000);

function toggleQR(){
  const qr = document.getElementById("qrBox");
  const fullInfo = document.getElementById("fullInfo");
  const lightInfo = document.getElementById("lightInfo");
  const phoneElem = fullInfo.querySelector(".phone");
  const birthElem = fullInfo.querySelector(".birth");
  const addrElem = document.getElementById("addr");

  if(qr.style.display === "block"){
    // QR 끄기 → 전체 정보 보이게
    qr.style.display = "none";
    lightInfo.style.display = "block";
    phoneElem.style.display = "block";
    addrElem.style.display = "block";
    birthElem.style.display = "block";
  } else {
    // QR 켜기 → 주소 + 생일만
    qr.style.display = "block";
    lightInfo.style.display = "none";
    phoneElem.style.display = "none";
    addrElem.style.display = "block";
    birthElem.style.display = "block";
  }
}
</script>

</body>
</html>
